name: Backend Tests

on:
  push:
    branches: [master]
    paths: ['lotrbackend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['lotrbackend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotrbackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lotrbackend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v
