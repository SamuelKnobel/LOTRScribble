name: Build and Deploy Frontend

on:
  push:
    branches: [master]
    paths: ['lotrfrontend/**', '.github/workflows/main.yml']
  workflow_dispatch:

permissions:
  contents: write   # allows pushing to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotrfrontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count (build number) is correct

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lotrfrontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          CI: false   # CRA treats warnings as errors under CI=true; your code has lint warnings
          REACT_APP_DOWNLOAD_PASSWORD: ${{ secrets.REACT_APP_DOWNLOAD_PASSWORD }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./lotrfrontend/build
          publish_branch: main
