summary: Get a specific {{ name }}
description: Retrieve detailed information about a {{ name }} by its unique ID.
tags:
  - {{ tag }}
parameters:
  - name: id
    in: path
    type: string
    required: true
    description: The unique MongoDB ID of the {{ name }}.
responses:
  200:
    description: {{ name }} found successfully
    schema:
      type: object
      properties:
        _id:
          type: string
          description: The unique identifier
        name:
          type: string
          description: Name of the {{ name }}
  404:
    description: {{ name }} not found